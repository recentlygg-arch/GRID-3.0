name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # raylib 5.5 (исходники) нужен в app/src/main/cpp/raylib - в репозиторий его класть не надо
      - name: Download raylib 5.5
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git app/src/main/cpp/raylib

      - name: Install SDK platform, NDK and CMake
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK (with version)
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GRIT-${VER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/GRIT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GRIT-apk
          path: dist/*.apk
          if-no-files-found: error

  # Публикация APK в Releases при создании тега:  git tag v2.8 && git push --tags
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GRIT-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: GRIT.apk
